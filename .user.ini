; PHP-FPM / Apache per-directory overrides. Raises upload limits so the
; admin page-content editor can replace the homepage brand video (≈42MB).
; Applies automatically in FPM/CGI setups; php artisan serve ignores this
; file (see composer.json "dev" script for the matching CLI flags).
upload_max_filesize = 60M
post_max_size = 60M
memory_limit = 256M
max_execution_time = 120
