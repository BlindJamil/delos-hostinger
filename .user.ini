; PHP-FPM / Apache per-directory overrides. Raises upload limits so the
; admin page-content editor can replace the homepage brand video (≈42MB)
; AND raises max_input_vars well above the form-field count so the
; editor's big multi-section save never gets its payload truncated by
; PHP silently (the default 1000 is too close to the 600-ish inputs the
; homepage editor submits).
; Applies automatically in FPM/CGI setups; php artisan serve ignores this
; file (see composer.json "dev" script for the matching CLI flags).
upload_max_filesize = 60M
post_max_size = 60M
memory_limit = 256M
max_execution_time = 120
max_input_vars = 5000
